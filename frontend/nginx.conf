# Statisk serverkonfiguration för den byggda Angular-applikationen
# (ADR-0007). Ersätter nginx-unprivileged-basimagens standard-serverblock.
#
# - Serverar den redan byggda, statiska produktionsartefakten (ng build).
# - SPA-fallback: alla routes som inte matchar en faktisk fil eller katalog
#   faller tillbaka till index.html, så Angular-routern kan ta över även
#   vid direkt djuplänk (t.ex. /tjanster/exempel).
# - Reverse proxy mot /api implementeras medvetet INTE här - den externa
#   same-origin-routingen (/ -> frontend, /api/... -> Portal.Api) ägs av
#   Hosting Labs reverse proxy, inte av denna container.
# - Ingen miljö- eller Hosting Lab-specifik konfiguration förekommer här.

server {
    listen       8080;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
